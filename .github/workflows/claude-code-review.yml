name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude[bot]'
          track_progress: true
          prompt: |
            Review this pull request against the conventions in CLAUDE.md and
            feature-work/README.md. Focus on:

            - Correctness, edge cases, and error handling (no swallowed
              exceptions, no defensive try/except that hides root causes)
            - Async/IO correctness — this codebase is async by default
            - Type hints on new code, ruff-clean style
            - Test coverage for new behavior, especially store/bus interactions
            - Sandbox / container assumptions (bwrap, Docker mounts)
            - Documentation: frontmatter present and accurate when feature-work
              docs are added or modified

            Leave inline comments for specific issues. Summarize overall
            assessment at the end. Skip nits on formatting that ruff already
            catches.
