# dev_provisioning examples — strategy × kind matrix
#
# Per docs/v2.0/dev-environment/design.md §"Provisioning strategies":
# every data_store / external_dependency in architecture.yaml that
# wants per-agent isolation declares one of the strategies below.
#
# These are illustrative architecture.yaml fragments — paste the
# data_store entry of interest into the project's
# .jig/spec/architecture.yaml under data_stores: and the orchestrator's
# RESOLVE / PROVISION step will pick it up.
#
# Strategy decision matrix:
#
#   shared_namespaced  → service has a namespace primitive (schema,
#                        prefix, bucket). Cheap. DEFAULT for the cheap
#                        kinds (postgres / nats / redis / s3).
#
#   per_agent_ephemeral → service doesn't namespace cleanly OR the
#                         test pattern needs absolute isolation
#                         (DROP TABLE, ALTER ROLE, ...). More expensive
#                         (N services × M agents). DEFAULT for sqlite.
#
#   operator_supplied  → operator owns the service (existing dev infra).
#                        jig only injects the connection string;
#                        provisioning + cleanup is operator's
#                        responsibility.
#
# All examples below render via the manifest derivation step
# (jig.dev_env.manifest.derive_manifest); the resulting manifest lives
# at .jig/dev/manifest.yaml and is what the orchestrator reads at
# spawn time.

# ---------------------------------------------------------------------------
# shared_namespaced × postgres — the bones default for relational data
# ---------------------------------------------------------------------------
- id: main-db
  kind: postgres
  rationale: ACID + per-agent schema namespacing
  accessed_by: [catalog-ingest, categorization, search-api]
  dev_provisioning:
    strategy: shared_namespaced
    namespace_template: "agent_{ticket_id}"
    cleanup_on_success: drop
    cleanup_on_failure: archive
    connection_string_template: "postgresql://jig:jig@localhost:5432/jigdev?options=-c%20search_path%3D{namespace}"

# ---------------------------------------------------------------------------
# shared_namespaced × nats — subject prefix for the event bus
# ---------------------------------------------------------------------------
- id: event-bus
  kind: nats
  rationale: lightweight subject-prefix isolation
  accessed_by: [catalog-ingest, categorization, analytics]
  dev_provisioning:
    strategy: shared_namespaced
    namespace_template: "agent.{ticket_id}"
    connection_string_template: "nats://localhost:4222?subject_prefix={namespace}"

# ---------------------------------------------------------------------------
# shared_namespaced × redis — key prefix for the cache
# ---------------------------------------------------------------------------
- id: cache
  kind: redis
  rationale: per-agent key prefix; share the disk + connection pool
  accessed_by: [search-api]
  dev_provisioning:
    strategy: shared_namespaced
    namespace_template: "agent_{ticket_id}"
    connection_string_template: "redis://localhost:6379/0?key_prefix={namespace}"

# ---------------------------------------------------------------------------
# shared_namespaced × s3 — bucket prefix for object storage
# ---------------------------------------------------------------------------
- id: objects
  kind: s3
  rationale: per-agent bucket prefix; one minio container shared
  accessed_by: [media-pipeline]
  dev_provisioning:
    strategy: shared_namespaced
    namespace_template: "agent-{ticket_id}-"
    connection_string_template: "s3://localhost:9000/jigdev?bucket_prefix={namespace}"

# ---------------------------------------------------------------------------
# per_agent_ephemeral × sqlite — Track E Final
#   Each agent gets its own SQLite file under
#   .jig/dev/ephemeral/<service_id>/<namespace>.db.
#   Cleanup honors the policy: drop deletes; archive moves to
#   .jig/dev/archive/<ts>_<service>_<agent>_<ticket>_<namespace>.db.bak;
#   keep leaves the file in place.
# ---------------------------------------------------------------------------
- id: agent-scratch
  kind: sqlite
  rationale: SQLite locks file-globally; per-agent file is the only safe option
  accessed_by: [some-module]
  dev_provisioning:
    strategy: per_agent_ephemeral
    namespace_template: "agent_{ticket_id}"
    cleanup_on_success: drop
    cleanup_on_failure: archive

# ---------------------------------------------------------------------------
# per_agent_ephemeral × postgres — Track E Final
#   Each agent gets a fresh Postgres database via CREATE DATABASE
#   <namespace>; cleanup runs DROP DATABASE / ALTER DATABASE RENAME.
#   Heavier than shared_namespaced (per-DB system catalog overhead)
#   but the only safe option when tests need DROP TABLE / ALTER ROLE
#   / extension installs.
# ---------------------------------------------------------------------------
- id: ephemeral-db
  kind: postgres
  rationale: tests need DROP TABLE; schema isolation isn't enough
  accessed_by: [migrations-tests]
  dev_provisioning:
    strategy: per_agent_ephemeral
    namespace_template: "jig_eph_{agent_id}_{ticket_id}"
    cleanup_on_success: drop
    cleanup_on_failure: archive

# ---------------------------------------------------------------------------
# operator_supplied × postgres — operator's existing dev cluster
#   jig doesn't manage isolation. The connection string is
#   operator-supplied (typically via env or .jig/dev/secrets.yaml).
# ---------------------------------------------------------------------------
- id: legacy-warehouse
  kind: postgres
  rationale: operator points at their existing analytics warehouse
  accessed_by: [analytics]
  dev_provisioning:
    strategy: operator_supplied
    namespace_template: "noop_{ticket_id}"
    cleanup_on_success: keep
    cleanup_on_failure: keep
