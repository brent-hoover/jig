constraints:
- HTTP layer must be abstracted behind an injectable client interface so tests can
  replay fixture corpora without live network calls (required by the eval-mode AC
  on fetch-top-stories).
- --limit N is the candidate pool size fetched from the API; filters (--min-score,
  --type) are applied AFTER the fetch. The tool MUST NOT over-fetch or paginate to
  backfill filtered rows.
- Ranks in final output must be renumbered 1..K contiguously after filtering, not
  preserved from original HN rank.
- "No rich TUI, color, or interactive elements \u2014 plain text by default, JSON\
  \ via --format json."
- No authentication, no write operations, no state mutation against the HN API.
