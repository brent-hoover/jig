name: Hacker News CLI
summary: A small command-line tool that prints Hacker News top stories.
generated_at: "2026-05-19T00:08:48.078427Z"
spec_version: 1

capabilities:
  - id: fetch-top-stories
    title: Fetch top stories
    state: planned
    summary: >-
      `hn-cli top --limit N` fetches the top N Hacker News stories from the HN
      API and prints them as a ranked list with score, title, and URL.
    user_story:
      as: developer in the terminal
      want: to fetch the top HN stories quickly
      benefit: I can skim headlines without opening a browser
    behaviors:
      - id: run-top-cmd
        description: >-
          `hn-cli top --limit N` prints N stories ranked by HN score, one per
          line.
        examples: []
        acceptance_criteria:
          - Exit code is 0 on success.
          - >-
            `--limit N` is the size of the candidate pool fetched from the HN
            API, not a guarantee of output row count. Filters (`--min-score`,
            `--type`) are applied AFTER the limit-N fetch and MAY reduce the
            output to fewer than N rows. The tool MUST NOT over-fetch or
            paginate to backfill filtered rows — operators wanting more chances
            after filtering raise `--limit`.
          - >-
            Output contains AT MOST N lines; fewer is correct when the API
            returned fewer than N stories OR filters rejected some candidates.
          - >-
            Each line matches the format `<rank>.  <score>  <title>  <url>`
            (e.g. `1.  428  Show HN: ...  https://...`).
          - >-
            Ranks in the final output are renumbered 1..K contiguously, where K
            is the post-filter row count (NOT the original HN rank).
          - >-
            In eval mode, story IDs and titles match the fixture corpus
            deterministically (tracer: `hn-cli top --limit 3`).
    acceptance_criteria: []
    examples: []
    done_enough: []
    excluded: []
    open_questions: []
    tickets: []
    aliases: []
