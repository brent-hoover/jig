  - id: filter-by-score
    title: Filter by score
    state: planned
    summary: >-
      `--min-score N` drops any story whose score falls below N, leaving only
      high-signal items.
    user_story:
      as: developer
      want: to filter out low-score stories
      benefit: I only see popular content
    behaviors:
      - id: min-score-flag
        description: "`--min-score N` removes stories with score < N from the output."
        examples: []
        acceptance_criteria:
          - No story with score below N appears in the output.
