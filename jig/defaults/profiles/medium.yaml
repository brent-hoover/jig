name: medium
description: >
  Standard profile for multi-module projects with external integrations,
  multiple datastores, or compliance requirements. Distinguishing feature
  from ``small``: the ``feature-s-full`` workflow at ``s``-size brings
  the full specialist reviewer federation (architectural, error-handling,
  performance, security, pattern-conformance). xs tickets share the same
  ``feature-s`` workflow as ``small`` — no spawn of the five-reviewer
  federation on a one-file change, but still TDD.
# sa_mvp produces per-module contracts.yaml files for the specialist
# reviewer federation. The v2 init pipeline is active: a medium `jig init`
# drives the L0–L3 PO chain (docs/brief.md → discovery.md → suites.yaml →
# per-suite spec.structured.yaml), so sa_mvp has the upstream artifacts it
# reads. classify_resume branches on profile.name == "medium" to run that
# chain, then spawns sa_mvp. See feature-work/medium-l0-l3-pipeline and #137.
sa_role: sa_mvp
workflows:
  default_by_size:
    xs: feature-s
    s: feature-s-full
    m: default
    l: default
  available:
    - feature-s
    - feature-s-full
    - default
    - bugfix
    - migration
    - perf
    - validation
    - spike
