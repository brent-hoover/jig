name: medium
description: >
  Standard profile for multi-module projects with external integrations,
  multiple datastores, or compliance requirements. Distinguishing feature
  from ``small``: the ``feature-s-full`` workflow at ``s``-size brings
  the full specialist reviewer federation (architectural, error-handling,
  performance, security, pattern-conformance). xs tickets share the same
  ``feature-s`` workflow as ``small`` — no spawn of the five-reviewer
  federation on a one-file change, but still TDD.
# sa_mvp is the long-term target — it produces per-module contracts.yaml
# files for the specialist reviewer federation. classify_resume now
# correctly recognises the arch_finalize Handoff (Handoff phase=pm) as
# SA-done, unblocking the flip. Deferred until the v2 init pipeline
# (discovery.md / suites.yaml) ships so sa_mvp has the upstream artifacts
# it reads. See issue #137 and the sa_mvp role definition.
sa_role: sa
workflows:
  default_by_size:
    xs: feature-s
    s: feature-s-full
    m: default
    l: default
  available:
    - feature-s
    - feature-s-full
    - default
    - bugfix
    - migration
    - perf
    - validation
    - spike
