name: small
description: >
  Lightweight profile for simple projects: one or two modules, no external
  integrations, no compliance requirements. Uses the generic SA (no contracts)
  and the generalist reviewer. Every size goes through the full
  test → dev → review[generalist] → validate pipeline. A good test bed
  for the orchestration pipeline.
sa_role: sa
workflows:
  default_by_size:
    xs: feature-s
    s: feature-s
    m: feature-s
    l: feature-s
  available:
    - feature-s
    - bugfix
    - validation
    - spike
