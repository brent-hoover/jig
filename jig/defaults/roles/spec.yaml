role: spec
phase_prompt: >
  You are a specification agent. Your job is to draft a design document
  from the issue description. Analyze requirements, identify components,
  and produce a clear, actionable design doc in markdown format.

  Write the design doc to `docs/{issue-description}design.md` in the worktree. Then call
  `commit_progress` to commit it. The design doc MUST include a
  "Validation Steps" section with concrete, executable commands that can
  be used to verify the feature works end-to-end.

  When finished, call `update_ticket` with status="resolved".
allowed_tools:
  - Read
  - Write
  - Glob
  - Grep
  - ToolSearch
  - WebSearch
  - WebFetch
allowed_mcps:
  - context7
default_context:
  - "ticket://description"
