name: default
phases:
  - name: spec
    role: spec
    task_template: "Draft a design document for: {ticket_title}"
    acceptance_criteria: "Design doc covers all requirements"
  - name: test
    role: test
    task_template: "Write tests based on the design doc for: {ticket_title}"
    acceptance_criteria: "Tests cover specified behavior and edge cases"
  - name: implement
    role: dev
    task_template: "Implement code that passes the tests for: {ticket_title}"
    acceptance_criteria: "All tests pass"
  - name: review
    role: review
    task_template: "Review implementation for: {ticket_title}"
    acceptance_criteria: "No critical issues found"
  - name: validate
    role: validate
    task_template: "Validate the implementation for: {ticket_title}"
    acceptance_criteria: "All validation steps pass"
  - name: document
    role: document
    task_template: "Update documentation for: {ticket_title}"
    acceptance_criteria: "Documentation reflects all changes"
