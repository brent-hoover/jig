name: feature-s
phases:
  - name: test
    role: test
    task_template: "Write tests for: {ticket_title}"
    acceptance_criteria: "Tests cover the specified behavior"
    automated_checks:
      - pytest-new-tests-fail
      - ruff-check
  - name: implement
    role: dev
    task_template: "Implement the feature so tests pass for: {ticket_title}"
    acceptance_criteria: "All tests pass"
    automated_checks:
      - pytest-diff-tests
      - ruff-check
      - mypy-strict
  - name: review
    role: review
    task_template: "Generalist review of: {ticket_title}"
    acceptance_criteria: "No critical or important issues found"
    reviewers:
      - "reviewer-generalist"
    # Sole-reviewer profile: two informed passes on the first round so
    # discovery is front-loaded; re-review rounds are single-pass and
    # delta-scoped (review-severity-binary design §4).
    review_passes: 2
  - name: validate
    role: validate
    task_template: "Validate the implementation for: {ticket_title}"
    acceptance_criteria: "All tests pass, linters clean"
    automated_checks:
      - pytest-all
      - ruff-check
      - mypy-strict
