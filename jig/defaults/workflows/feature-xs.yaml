name: feature-xs
phases:
  - name: implement
    role: dev
    task_template: "Implement the feature for: {ticket_title}"
    acceptance_criteria: "Feature works as described, existing tests still pass"
    automated_checks:
      - pytest-diff-tests
      - mypy-strict
  - name: review
    role: review
    task_template: "Single-pass generalist review of: {ticket_title}"
    acceptance_criteria: "No critical or important issues found"
    reviewers:
      - "reviewer-generalist"
  - name: validate
    role: validate
    task_template: "Validate the implementation for: {ticket_title}"
    acceptance_criteria: "All tests pass, linters clean"
    automated_checks:
      - pytest-all
      - ruff-check
      - mypy-strict
