[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jig"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "claude-agent-sdk>=0.1.58",
    "websockets>=13.0",
    "rich>=13.0",
    "textual>=0.80",
    "radon>=6.0.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "mypy>=1.11",
    "semgrep>=1.164.0",
]

[project.scripts]
jig = "jig.__main__:main"

[tool.setuptools.packages.find]
include = ["jig*"]

[tool.setuptools.package-data]
"jig.skills" = ["*.md"]
"jig.issues" = ["*.html"]
# Capability enforcement hook scripts (Phase 5 Task G). Shipped as
# executable no-extension scripts so Claude Code can invoke them as
# ``/jig/bin/check-bash`` etc. after bwrap bind-mounts the directory.
"jig.bin" = ["check-bash", "check-write", "check-path", "_hooklib.py"]
# Synthetic operator persona YAMLs (Track H3, bones). bones ships only
# methodical; MVP/Final extend with the rest.
"jig.sim.personas" = ["*.yaml"]
# Built-in defaults: roles, workflows, work_types, profiles, and the
# shipped check catalog (loaded as a fallback when the project lacks
# ``.jig/checks.yaml``). ``*.md`` covers ``agent_claude_md.md`` (the
# global CLAUDE.md injected into every agent spawn) and any future
# top-level markdown defaults.
"jig.defaults" = ["checks.yaml", "*.md"]
# ``**/*.md`` covers per-role ``CLAUDE.md`` addendums shipped at
# ``jig/defaults/roles/<role>/CLAUDE.md`` and concatenated onto the
# global agent CLAUDE.md at spawn time (jig.agent_config).
"jig.defaults.roles" = ["*.yaml", "**/*.md"]
"jig.defaults.workflows" = ["*.yaml"]
"jig.defaults.work_types" = ["*.yaml"]
"jig.defaults.profiles" = ["*.yaml"]
# AI-audit taxonomy manifest (jig-shipped, loaded via importlib.resources at
# runtime — must be in the wheel or load_taxonomy() fails for installed jig).
"jig.code_quality" = ["*.yaml"]
# Project templates copied at scaffolding time. Each template ships
# template.yaml at the top plus a tree of source files (src/, tests/),
# config (pyproject.toml, README.md, .gitignore). The "**/*" glob picks
# up regular files; "**/.*" is the explicit dotfile pass because
# pathlib-glob (which setuptools uses) does NOT match hidden files with
# "*". Without the dotfile pattern, .gitignore (and any future
# .dockerignore / .env.example / etc.) silently miss the built wheel
# and scaffolded projects come up incomplete. "**/.jig/**/*" specifically
# covers per-template .jig/CLAUDE.md starters — the per-dotfile pattern
# only matches files whose final component is hidden, so without this
# third entry .jig/CLAUDE.md silently missed the wheel even though the
# source tree was correct. The narrow ".jig/" form is deliberate: a
# broader "**/.*/**/*" pattern would also bundle .ruff_cache/,
# __pycache__/, .mypy_cache/ binary artifacts that happen to exist in
# the template trees (already skipped at scaffold time via the
# skip_dirs set in init_workflow._apply_template_files, but otherwise
# would inflate the wheel).
"jig.defaults.project_templates" = ["**/*", "**/.*", "**/.jig/**/*"]
# Eval resource files loaded from `Path(__file__).parent` at runtime —
# task fixtures, rubrics, and the watcher analyzer prompt.
"jig.evals.prompt_style_eval" = ["tasks/**/*", "rubric/*.yaml"]
"jig.evals.watcher" = ["prompts/*.md"]

# Setuptools' globs traverse INTO hidden directories (fnmatch doesn't have
# the shell rule of "* skips leading dots"), so a stale `.ruff_cache/`,
# `__pycache__/`, or `.mypy_cache/` left in a template tree from a local
# build would get bundled into the wheel. Scaffolding already skips these
# at copy time (see `skip_dirs` in `init_workflow._apply_template_files`),
# but excluding them at packaging time keeps the wheel clean regardless of
# the local source-tree state.
[tool.setuptools.exclude-package-data]
"jig.defaults.project_templates" = [
    "**/.ruff_cache/**",
    "**/__pycache__/**",
    "**/.mypy_cache/**",
    "**/.pytest_cache/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Bundled project templates carry their own tests/test_*.py files for
# the template-smoke runner to exercise. Don't collect them with the
# main suite — they'd run with the literal unsubstituted ``myproject``
# package name and fail at import time.
norecursedirs = ["jig/defaults/project_templates"]
# Custom markers. ``real`` opts into tests that exercise real-mode
# wiring with a monkeypatched Claude SDK; the FULL real-mode run
# (operator-only, costs LLM tokens) is invoked via
# ``uv run jig sim run … --real`` not via pytest.
#
# ``sim_smoke`` selects every smoke-tier sim scenario test. CI runs the full
# suite (``pytest tests/``) on every PR; ``-m sim_smoke`` can be used to run
# only the 80 sim scenario tests in isolation.
# Higher tiers (full, nightly) run via ``jig sim run-tier <tier>``,
# not pytest, because they have looser cost + runtime budgets.
markers = [
    "real: tests that touch real-mode wiring (skipped by default; opt in with -m real)",
    "sim_smoke: smoke-tier sim scenario tests",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = [
    "^evals/projects/",
    "^jig/defaults/project_templates/",
    "^jig/evals/prompt_style_eval/tasks/.*/tests/",
    "^scripts/dogfood_smoke\\.py$",
    "^scripts/tui_demo\\.py$",
    "^tests/",
]

[[tool.mypy.overrides]]
module = [
    "radon.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

# Incremental mypy adoption: these modules suppress the error codes below rather
# than being fully typed. mypy is effectively off for them — the "clean mypy"
# baseline holds only for modules NOT listed here. Graduate modules out of this
# list one at a time as their typing is cleaned up; the goal is to empty it.
[[tool.mypy.overrides]]
module = [
    "jig.agent",
    "jig.catalog",
    "jig.check_runner",
    "jig.cli",
    "jig.eval.runner",
    "jig.init_workflow",
    "jig.issues.cli",
    "jig.issues.mcp",
    "jig.issues.service",
    "jig.onboard_workflow",
    "jig.orchestrator",
    "jig.pm.cycle_view",
    "jig.po_l1_mcp",
    "jig.sa_incremental_mcp",
    "jig.sim.cli",
    "jig.sim.driver",
    "jig.tui.*",
    "jig.uri.spec",
    "jig.vd_mcp",
    "jig.ws_server",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "dict-item",
    "index",
    "operator",
    "override",
    "union-attr",
    "valid-type",
]

[dependency-groups]
dev = [
    "prek>=0.4.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.13",
]
