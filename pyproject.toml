[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jig"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "claude-agent-sdk>=0.1.58",
    "websockets>=13.0",
    "rich>=13.0",
]

[project.scripts]
jig = "jig.cli:cli"

[tool.setuptools.packages.find]
include = ["jig*"]

[tool.setuptools.package-data]
"jig.skills" = ["*.md"]
# Capability enforcement hook scripts (Phase 5 Task G). Shipped as
# executable no-extension scripts so Claude Code can invoke them as
# ``/jig/bin/check-bash`` etc. after bwrap bind-mounts the directory.
"jig.bin" = ["check-bash", "check-write", "check-path", "_hooklib.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
