spec_version: 1
id: bones-walking-skeleton
description: |
  The v2 walking-skeleton tracer bullet. A methodical operator drives a
  trivial backend project from L0 pitch through one ticket merged.
  Validates the bones-scope of every track (A through G) end-to-end:
  PO L0/L3, manual L1/L2/SA artifacts, build-plan + Coordinator,
  contract-compliance reviewer, analytics tagging.

  Per ``docs/v2.0/implementation/v2-plan.md`` Bones success criteria:
  - Operator manually walks past L1/L2/L3 with minimal one-suite/
    one-capability content.
  - Operator manually writes a 5-line architecture.yaml + 5-line
    contracts.yaml.
  - Operator manually writes a build-plan with one ticket.
  - Coordinator dispatches the ticket; (mock) dev agent implements it;
    contract-compliance reviewer passes; ticket resolves.
  - Analytics events flow throughout; simulator: true tag isolates
    them from real-project corpora.

persona: methodical
estimated_cost_usd_max: 1.0
coverage_tags:
  - po-l0
  - po-l3
  - sa-bones
  - pm-coordinator-bones
  - dev-mock
  - reviewer-contract-compliance

steps:
  # ---- L0 PO --------------------------------------------------------
  - kind: invoke_l0_finalize
    params:
      name: bones-walking-skeleton
      pitch: a tiny tracer-bullet project that exercises every layer of v2
      problem: |
        We need a single happy-path scenario that walks every v2
        component end-to-end so we can prove the integration spine
        composes before flushing out features.
      audience: |
        Internal jig developers validating that the bones layer of
        each v2 track holds together.
      non_goals:
        - id: no-edge-cases
          text: This scenario does not cover edge cases or failure modes
          rationale: bones tracer; MVP scenarios cover those
      author: po-l0
    assertions:
      - kind: artifact_written
        path: docs/brief.md
        contains: bones-walking-skeleton
      - kind: artifact_written
        path: .jig/spec/project.structured.yaml

  # ---- L1 / L2 (operator hand-writes; bones skips the discovery agents) ---
  - kind: write_suites_yaml
    params:
      suites_index:
        spec_version: 2
        suites:
          - id: catalog
            title: Catalog
            summary: ingestion of catalog data into the local store
            capabilities:
              - shopify-connect
        crosscutting_non_goals: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites.yaml
        contains: shopify-connect

  # ---- L3 PO --------------------------------------------------------
  - kind: invoke_l3_finalize
    params:
      suite_id: catalog
      intro: |
        Catalog ingestion suite: pull catalog data from Shopify and
        normalize into our products collection.
      capabilities:
        - id: shopify-connect
          title: Connect Shopify store via OAuth
          state: planned
          summary: |
            Operator authorizes their Shopify store; we pull the catalog
            and normalize into the products collection.
          behaviors:
            - id: begin-oauth
              description: Operator initiates OAuth handshake from settings
              acceptance_criteria:
                - Operator clicks Connect Shopify and is redirected
            - id: pull-catalog
              description: After OAuth completes we pull the catalog
              acceptance_criteria:
                - Catalog rows appear in the products collection
      non_goals: []
      author: po-l3
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites/catalog/brief.md
        contains: shopify-connect

  # ---- SA (operator hand-writes architecture + module contract for bones) ---
  - kind: write_architecture
    params:
      architecture:
        spec_version: 1
        modules:
          - id: catalog-ingest
            title: Catalog ingest
            summary: |
              Pulls catalog data from Shopify and normalizes into the
              products collection.
            implements_capabilities:
              - shopify-connect
            owns:
              - products
            tier_hint: standard
            requires_tracer_bullet: true
            intent:
              problem: |
                Bones needs a module that owns the products collection
                so the contract-compliance reviewer has something to
                check the dev's diff against.
              simplest_solution: |
                One module that handles Shopify ingest and writes to
                a single owned collection.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        data_stores: []
        shared_contracts: []
        cross_cutting_policies: []
        risks: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/architecture.yaml
        contains: catalog-ingest

  - kind: write_module_contracts
    params:
      module_id: catalog-ingest
      contracts:
        spec_version: 1
        module: catalog-ingest
        owns:
          - collection: products
            db: catalog
            write_access:
              - self
            read_access: []
        external_dependencies: []
        exposes: []
        emits: []
        integration_ac:
          - capability: shopify-connect
            must:
              - Shopify catalog data flows into the products collection
              - catalog-ingested event published with normalized payload
        behavioral_contracts: []
        data_contracts: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/modules/catalog-ingest/contracts.yaml
        contains: shopify-connect

  # ---- PM (operator hand-writes build plan; Coordinator materializes) ---
  - kind: write_build_plan
    params:
      plan:
        spec_version: 1
        project: bones-walking-skeleton
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: catalog-ingest
            title: Catalog ingest tracer bullet
            suite: catalog
            modules:
              - catalog-ingest
            layers:
              bones:
                status: not_started
                tickets:
                  - tb-catalog-ingest
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: |
                Validate the bones spine end-to-end: a single ticket
                walks from PM dispatch through dev + reviewer to
                resolved.
              simplest_solution: |
                One epic, one bones ticket, one capability, one
                integration AC.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
            acceptance_criteria:
              - "Scenario placeholder; refine per test intent."
        stalled: []
        open_questions: []
    assertions:
      - kind: artifact_written
        path: .jig/plan/build-plan.yaml
        contains: tb-catalog-ingest

  - kind: materialize_tickets
    assertions:
      - kind: ticket_status
        ticket_id: tb-catalog-ingest
        status: open

  # ---- Dev (mock in CI; real-mode CLI replaces this with a Claude agent) ---
  - kind: mock_dev_commit
    params:
      ticket_id: tb-catalog-ingest

  # ---- Reviewer ----------------------------------------------------
  - kind: run_reviewer
    params:
      ticket_id: tb-catalog-ingest
    assertions:
      - kind: reviewer_returned_no_critical
        reviewer_id: contract-compliance

# ---- final assertions: spine cohesion + analytics + cost ---------------
final_assertions:
  - kind: ticket_status
    ticket_id: tb-catalog-ingest
    status: resolved
  - kind: analytics_event_emitted
    event_kind: ticket_state_changed
    field_constraints:
      ticket_id: tb-catalog-ingest
      to_state: resolved
  - kind: cost_under_budget
    usd: 1.0
