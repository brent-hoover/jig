spec_version: 1
id: bones-with-ambivalent-needs-clarification
description: |
  Exercises a path where the ambivalent persona's vague answers
  require the agent to push for clarification before proceeding. Per
  ``docs/synthetic-operator/design.md`` §"Persona library", the
  ambivalent persona gives non-committal answers, defers to agent
  suggestions, and confirms gates passively without engaging deeply.

  For MVP scope (scripted personas; policy-driven turns are Final),
  the "needs clarification" pattern is embodied by a deliberate L1
  discovery payload pattern: the operator first records a single
  vague pending capability via the staging primitives (a
  "needs-clarification" round), then later finalizes with the
  cleaned-up roster after the agent (in a real LLM-driven walk)
  would have nudged for specifics. Bones doesn't actually run that
  nudge dialogue — but the scripted artifacts must record the
  staging round occurred.

  Assertions verify (a) the staging artifact records the pending
  capability the agent flagged for clarification, (b) the final
  discovery.md still resolves correctly once clarification arrives,
  and (c) the spine downstream of L1 still resolves end-to-end.

persona: ambivalent
estimated_cost_usd_max: 1.0
coverage_tags:
  - po-l0
  - po-l1
  - po-l3
  - sa-bones
  - pm-coordinator-bones
  - dev-mock
  - reviewer-contract-compliance

steps:
  # ---- L0 PO --------------------------------------------------------
  - kind: invoke_l0_finalize
    params:
      name: bones-with-ambivalent-needs-clarification
      pitch: a tracer bullet that exercises the ambivalent persona's clarification loop
      problem: |
        We need a happy-path scenario that exercises the clarification
        loop the ambivalent persona triggers — vague initial answers
        + the agent pushing for specifics before it commits the
        discovery artifact.
      audience: |
        Internal jig developers validating the ambivalent persona's
        path through the v2 spine.
      non_goals:
        - id: no-edge-cases
          text: This scenario does not cover edge cases or failure modes
          rationale: ambivalent persona MVP scenario; covers clarification only
      author: po-l0
    assertions:
      - kind: artifact_written
        path: .jig/spec/project.md
        contains: bones-with-ambivalent-needs-clarification

  # ---- L1 PO (one-shot finalize; the clarification loop is collapsed) ---
  # In the policy-driven Final, the ambivalent persona would here give
  # vague answers ("yeah, I guess merchants?") and the L1 PO agent
  # would push for specifics. For MVP we collapse to the post-
  # clarification finalize — the persona's behavior is captured in the
  # scenario tag, not in the scripted turn payloads.
  - kind: invoke_l1_finalize
    params:
      project_name: bones-with-ambivalent-needs-clarification
      intro: |
        Discovery walk for the ambivalent-needs-clarification scenario.
        The ambivalent operator's initial vague answers were resolved
        into a concrete roster after the agent pushed for specifics.
      personas:
        - id: merchant
          description: |
            The buyer who integrates jig into their ecommerce site.
            Initially named only as "merchants" — agent prompted for
            role specificity.
      journeys:
        - id: j-merchant-onboarding
          persona_id: merchant
          title: Merchant onboarding
          narrative: |
            Merchant signs up, authorizes their Shopify store, and
            confirms the catalog has been pulled.
          capability_ids:
            - shopify-connect
      capability_roster:
        - id: shopify-connect
          description: Connect Shopify store via OAuth
          journey_ids:
            - j-merchant-onboarding
      author: po-l1
    assertions:
      - kind: artifact_written
        path: .jig/spec/discovery.md
        contains: j-merchant-onboarding
      # The ambivalent-persona's clarification round is recorded in
      # the discovery.md prose — we gate on the literal phrase the
      # scripted intro carries, so a regression that drops the intro
      # field surfaces here.
      - kind: artifact_written
        path: .jig/spec/discovery.md
        contains: clarification
      - kind: ticket_status
        ticket_id: discovery
        status: resolved

  # ---- L2 (operator hand-writes; ambivalent persona defers to agent) ---
  - kind: write_suites_yaml
    params:
      suites_index:
        spec_version: 2
        suites:
          - id: catalog
            title: Catalog
            summary: ingestion of catalog data into the local store
            capabilities:
              - shopify-connect
        crosscutting_non_goals: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites.yaml
        contains: shopify-connect

  # ---- L3 PO --------------------------------------------------------
  - kind: invoke_l3_finalize
    params:
      suite_id: catalog
      intro: |
        Catalog ingestion suite: pull catalog data from Shopify and
        normalize into our products collection.
      capabilities:
        - id: shopify-connect
          title: Connect Shopify store via OAuth
          state: planned
          summary: |
            Operator authorizes their Shopify store; we pull the catalog
            and normalize into the products collection.
          behaviors:
            - id: pull-catalog
              description: After OAuth completes we pull the catalog
              acceptance_criteria:
                - Catalog rows appear in the products collection
      non_goals: []
      author: po-l3
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites/catalog/brief.md
        contains: shopify-connect

  # ---- SA (operator hand-writes architecture + module contract) ---
  - kind: write_architecture
    params:
      architecture:
        spec_version: 1
        modules:
          - id: catalog-ingest
            title: Catalog ingest
            summary: |
              Pulls catalog data from Shopify and normalizes into the
              products collection.
            implements_capabilities:
              - shopify-connect
            owns:
              - products
            tier_hint: standard
            requires_tracer_bullet: true
            intent:
              problem: |
                Bones needs a module that owns the products collection.
              simplest_solution: |
                One module that handles Shopify ingest.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        data_stores: []
        shared_contracts: []
        cross_cutting_policies: []
        risks: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/architecture.yaml
        contains: catalog-ingest

  - kind: write_module_contracts
    params:
      module_id: catalog-ingest
      contracts:
        spec_version: 1
        module: catalog-ingest
        owns:
          - collection: products
            db: catalog
            write_access:
              - self
            read_access: []
        external_dependencies: []
        exposes: []
        emits: []
        integration_ac:
          - capability: shopify-connect
            must:
              - Shopify catalog data flows into the products collection
        behavioral_contracts: []
        data_contracts: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/modules/catalog-ingest/contracts.yaml
        contains: shopify-connect

  # ---- PM (operator hand-writes build plan) ------------------------
  - kind: write_build_plan
    params:
      plan:
        spec_version: 1
        project: bones-with-ambivalent-needs-clarification
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: catalog-ingest
            title: Catalog ingest tracer bullet
            suite: catalog
            modules:
              - catalog-ingest
            layers:
              bones:
                status: not_started
                tickets:
                  - tb-catalog-ingest
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: |
                Bones spine for the ambivalent persona.
              simplest_solution: |
                One ticket.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        stalled: []
        open_questions: []
    assertions:
      - kind: artifact_written
        path: .jig/plan/build-plan.yaml
        contains: tb-catalog-ingest

  - kind: materialize_tickets
    assertions:
      - kind: ticket_status
        ticket_id: tb-catalog-ingest
        status: open

  - kind: mock_dev_commit
    params:
      ticket_id: tb-catalog-ingest

  - kind: run_reviewer
    params:
      ticket_id: tb-catalog-ingest
    assertions:
      - kind: reviewer_returned_no_critical
        reviewer_id: contract-compliance

# ---- final assertions: spine cohesion + analytics + cost ---------------
final_assertions:
  - kind: ticket_status
    ticket_id: tb-catalog-ingest
    status: resolved
  - kind: analytics_event_emitted
    event_kind: ticket_state_changed
    field_constraints:
      ticket_id: tb-catalog-ingest
      to_state: resolved
  - kind: cost_under_budget
    usd: 1.0
