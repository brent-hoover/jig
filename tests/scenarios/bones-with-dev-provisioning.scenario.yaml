spec_version: 1
id: bones-with-dev-provisioning
description: |
  Track E MVP — extends bones-with-mvp-sa with a ``dev_provisioning``
  block on the architecture's ``data_stores`` entry so the per-agent
  namespace provisioning lifecycle (CREATE SCHEMA + DROP SCHEMA on
  success) is exercised end-to-end without a real Postgres.

  The new ``invoke_dev_provisioning`` step injects an in-memory SQL
  recorder, fires ``provision_for_agent`` + ``cleanup_for_agent``,
  and gates the scenario on (a) the manifest landing on disk, (b)
  the JIG_DEV_MAIN_DB_URL env var being built, and (c) the
  expected SQL fragments appearing in the recorder.

persona: methodical
estimated_cost_usd_max: 1.0
coverage_tags:
  - po-l0
  - po-l1
  - po-l2
  - po-l3
  - sa-incremental
  - pm-planner
  - pm-coordinator-bones
  - dev-mock
  - reviewer-contract-compliance
  - dev-provisioning

steps:
  # ---- L0 PO --------------------------------------------------------
  - kind: invoke_l0_finalize
    params:
      name: bones-with-dev-provisioning
      pitch: tracer-bullet for the Track E MVP dev-provisioning lifecycle
      problem: |
        We need a single happy-path scenario that proves the dev-env
        provisioning hooks land per-agent namespaces + connection
        strings without breaking the rest of the v2 spine.
      audience: |
        Internal jig developers validating Track E MVP composes with
        the rest of the v2 spine.
      non_goals:
        - id: no-real-postgres
          text: This scenario uses an in-memory SQL recorder, not a real Postgres
          rationale: bones tracer; per-deployment Postgres wiring is operator-side
      author: po-l0
    assertions:
      - kind: artifact_written
        path: .jig/spec/project.md
        contains: bones-with-dev-provisioning

  # ---- L1 PO --------------------------------------------------------
  - kind: invoke_l1_finalize
    params:
      project_name: bones-with-dev-provisioning
      intro: |
        Discovery walk for the bones-with-dev-provisioning scenario.
      personas:
        - id: merchant
          description: The buyer who integrates jig into their ecommerce site
      journeys:
        - id: j-merchant-onboarding
          persona_id: merchant
          title: Merchant onboarding
          narrative: |
            Merchant signs up, authorizes their Shopify store, and
            confirms the catalog has been pulled into the products
            collection.
          capability_ids:
            - shopify-connect
      capability_roster:
        - id: shopify-connect
          description: Connect Shopify store via OAuth
          journey_ids:
            - j-merchant-onboarding
      author: po-l1
    assertions:
      - kind: artifact_written
        path: .jig/spec/discovery.md
        contains: j-merchant-onboarding

  # ---- L2 PO --------------------------------------------------------
  - kind: invoke_l2_finalize
    params:
      suites:
        - id: catalog
          title: Catalog
          summary: ingestion of catalog data into the local store
          capabilities:
            - shopify-connect
      crosscutting_non_goals: []
      author: po-l2
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites.yaml
        contains: shopify-connect

  # ---- L3 PO --------------------------------------------------------
  - kind: invoke_l3_finalize
    params:
      suite_id: catalog
      intro: |
        Catalog ingestion suite: pull catalog data from Shopify and
        normalize into our products collection.
      capabilities:
        - id: shopify-connect
          title: Connect Shopify store via OAuth
          state: planned
          summary: |
            Operator authorizes their Shopify store; we pull the
            catalog and normalize into the products collection.
          behaviors:
            - id: pull-catalog
              description: After OAuth completes we pull the catalog
              acceptance_criteria:
                - Catalog rows appear in the products collection
      non_goals: []
      author: po-l3
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites/catalog/brief.md
        contains: shopify-connect

  # ---- SA MVP — note the dev_provisioning block on the data store ------
  - kind: invoke_sa_incremental
    params:
      calls:
        - tool: arch_set_data_store
          params:
            data_store:
              id: main-db
              kind: postgres
              rationale: ACID + per-agent schema namespacing
              accessed_by: [catalog-ingest]
              dev_provisioning:
                strategy: shared_namespaced
                namespace_template: "agent_{ticket_id}"
                cleanup_on_success: drop
                cleanup_on_failure: archive
                connection_string_template: "postgresql://jig:jig@localhost:5432/jigdev?options=-c%20search_path%3D{namespace}"
        - tool: arch_set_module
          params:
            module:
              id: catalog-ingest
              title: Catalog Ingest
              summary: |
                Pulls catalog data from Shopify and normalizes into the
                products collection.
              implements_capabilities:
                - shopify-connect
              owns:
                - products
              tier_hint: standard
              requires_tracer_bullet: true
              n_a_categories:
                - behavioral_contracts
                - external_dependencies
              intent:
                problem: bones tracer needs a module that owns the products collection
                simplest_solution: one ingest module writing to one collection
                complications_considered:
                  scale: null
                  concurrency: null
                  failure_modes: null
                  cross_cutting: null
        - tool: module_set_owned_collection
          params:
            module_id: catalog-ingest
            owned_collection:
              collection: products
              db: main-db
              write_access: [self]
        - tool: module_set_integration_ac
          params:
            module_id: catalog-ingest
            integration_ac:
              capability: shopify-connect
              must:
                - Catalog rows appear in the products collection
      finalize:
        summary: SA — one data store with dev_provisioning + one module
        author: sa-mvp
    assertions:
      - kind: artifact_written
        path: .jig/spec/architecture.yaml
        contains: shared_namespaced
      - kind: artifact_written
        path: .jig/spec/architecture.yaml
        contains: agent_{ticket_id}
      - kind: ticket_status
        ticket_id: architecture
        status: resolved

  # ---- Track E MVP: dev-provisioning lifecycle ----------------------
  - kind: invoke_dev_provisioning
    params:
      ticket_id: tb-catalog-ingest
      cleanup: true
      success: true
    assertions:
      - kind: artifact_written
        path: .jig/dev/manifest.yaml
        contains: shared_namespaced

  # ---- Planner PM ----------------------------------------------------
  - kind: invoke_plan_finalize
    params:
      plan:
        spec_version: 1
        project: bones-with-dev-provisioning
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: catalog-ingest
            title: Catalog ingest tracer bullet
            suite: catalog
            modules:
              - catalog-ingest
            layers:
              bones:
                status: not_started
                tickets:
                  - tb-catalog-ingest
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: validate the bones spine end-to-end with dev_provisioning declared
              simplest_solution: one epic, one bones ticket
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        stalled: []
        open_questions: []
      author: planner-pm
    assertions:
      - kind: artifact_written
        path: .jig/plan/build-plan.yaml
        contains: tb-catalog-ingest

  - kind: materialize_tickets
    assertions:
      - kind: ticket_status
        ticket_id: tb-catalog-ingest
        status: open

  # ---- Dev (mock) ---------------------------------------------------
  - kind: mock_dev_commit
    params:
      ticket_id: tb-catalog-ingest

  # ---- Reviewer -----------------------------------------------------
  - kind: run_reviewer
    params:
      ticket_id: tb-catalog-ingest
    assertions:
      - kind: reviewer_returned_no_critical
        reviewer_id: contract-compliance

# ---- final assertions ---------------------------------------------------
final_assertions:
  - kind: ticket_status
    ticket_id: tb-catalog-ingest
    status: resolved
  - kind: artifact_written
    path: .jig/dev/manifest.yaml
    contains: main-db
  - kind: cost_under_budget
    usd: 1.0
