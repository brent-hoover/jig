spec_version: 1
id: bones-with-fast-and-shippy
description: |
  Same shape as ``bones-with-planner`` but driven by the
  fast-and-shippy persona. Per ``docs/v2.0/synthetic-operator/design.md``
  §"Persona library", fast-and-shippy accepts gates without scrutiny,
  pushes for MVP minimums, and willingly defers complications.

  For MVP scope the scripted scenario embodies that profile via the
  payloads it sends — short pitch, no caveats, complications all
  ``null`` (deferred), no extra non-goals beyond the scenario marker.
  Policy-driven turns (where the persona's profile actually generates
  responses) land in Final.

  Assertions verify the persona-specific behavior: the gate
  transitions land cleanly without extra discussion, the build plan
  has exactly one bones ticket (MVP minimum), and the spine resolves
  end-to-end like the methodical run does.

persona: fast-and-shippy
estimated_cost_usd_max: 1.0
coverage_tags:
  - po-l0
  - po-l3
  - sa-bones
  - pm-coordinator-bones
  - dev-mock
  - reviewer-contract-compliance

steps:
  # ---- L0 PO --------------------------------------------------------
  - kind: invoke_l0_finalize
    params:
      name: bones-with-fast-and-shippy
      pitch: ship the tracer bullet
      problem: |
        Validate the spine. Ship it.
      audience: |
        Internal jig developers.
      non_goals: []
      author: po-l0
    assertions:
      - kind: artifact_written
        path: docs/brief.md
        contains: bones-with-fast-and-shippy
      # Gate confirmation reached cleanly: the L0 ticket transitions
      # to resolved without re-opening (the methodical refusal-then-
      # confirm path doesn't fire here).
      - kind: ticket_status
        ticket_id: project
        status: resolved

  # ---- L1 / L2 (operator hand-writes; bones skips the discovery agents) ---
  - kind: write_suites_yaml
    params:
      suites_index:
        spec_version: 2
        suites:
          - id: catalog
            title: Catalog
            summary: ingest data into local store
            capabilities:
              - shopify-connect
        crosscutting_non_goals: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites.yaml
        contains: shopify-connect

  # ---- L3 PO --------------------------------------------------------
  - kind: invoke_l3_finalize
    params:
      suite_id: catalog
      intro: |
        Pull catalog data from Shopify. Ship it.
      capabilities:
        - id: shopify-connect
          title: Connect Shopify store
          state: planned
          summary: |
            Operator authorizes Shopify; we pull the catalog.
          behaviors:
            - id: pull-catalog
              description: After OAuth completes we pull the catalog
              acceptance_criteria:
                - Catalog rows appear in the products collection
      non_goals: []
      author: po-l3
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites/catalog/brief.md
        contains: shopify-connect

  # ---- SA (operator hand-writes architecture + module contract) ---
  - kind: write_architecture
    params:
      architecture:
        spec_version: 1
        modules:
          - id: catalog-ingest
            title: Catalog ingest
            summary: |
              Pull catalog data from Shopify. Single owned collection.
            implements_capabilities:
              - shopify-connect
            owns:
              - products
            tier_hint: standard
            requires_tracer_bullet: true
            intent:
              problem: |
                Need the bones spine module.
              simplest_solution: |
                One module, one owned collection.
              # fast-and-shippy defers all complications to later layers.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        data_stores: []
        shared_contracts: []
        cross_cutting_policies: []
        risks: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/architecture.yaml
        contains: catalog-ingest

  - kind: write_module_contracts
    params:
      module_id: catalog-ingest
      contracts:
        spec_version: 1
        module: catalog-ingest
        owns:
          - collection: products
            db: catalog
            write_access:
              - self
            read_access: []
        external_dependencies: []
        exposes: []
        emits: []
        integration_ac:
          - capability: shopify-connect
            must:
              - Shopify catalog data flows into the products collection
        behavioral_contracts: []
        data_contracts: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/modules/catalog-ingest/contracts.yaml
        contains: shopify-connect

  # ---- PM (operator hand-writes build plan; one ticket — MVP minimum) ---
  - kind: write_build_plan
    params:
      plan:
        spec_version: 1
        project: bones-with-fast-and-shippy
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: catalog-ingest
            title: Catalog ingest tracer bullet
            suite: catalog
            modules:
              - catalog-ingest
            layers:
              bones:
                status: not_started
                tickets:
                  - tb-catalog-ingest
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: |
                Bones spine.
              simplest_solution: |
                One ticket.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        stalled: []
        open_questions: []
    assertions:
      - kind: artifact_written
        path: .jig/plan/build-plan.yaml
        contains: tb-catalog-ingest

  - kind: materialize_tickets
    assertions:
      - kind: ticket_status
        ticket_id: tb-catalog-ingest
        status: open

  - kind: mock_dev_commit
    params:
      ticket_id: tb-catalog-ingest

  - kind: run_reviewer
    params:
      ticket_id: tb-catalog-ingest
    assertions:
      - kind: reviewer_returned_no_critical
        reviewer_id: contract-compliance

# ---- final assertions: spine cohesion + analytics + cost ---------------
final_assertions:
  - kind: ticket_status
    ticket_id: tb-catalog-ingest
    status: resolved
  - kind: analytics_event_emitted
    event_kind: ticket_state_changed
    field_constraints:
      ticket_id: tb-catalog-ingest
      to_state: resolved
  - kind: cost_under_budget
    usd: 1.0
