spec_version: 1
id: bones-with-fixture-replay
description: |
  Track E Final — exercises the vcr-style FixtureMiddleware in
  REPLAY_ONLY mode. The ``invoke_fixture_replay`` step records a
  cassette to ``.jig/dev/fixtures/<service_id>.jsonl``, then replays
  the same request through a no-client middleware. The handler asserts
  the replayed body matches the recording — REPLAY_ONLY with no
  backing client is the safest possible test of the cassette path.

  Block 2 extends the scenario with two ``invoke_fixture_env`` probes
  that pin the JIG_FIXTURE_MODE the orchestrator's spawn path now
  injects into ``ctx.extra_env``: a feature ticket defaults to
  ``replay_only`` and a SPIKE ticket defaults to ``record_new``.

persona: methodical
estimated_cost_usd_max: 1.0
coverage_tags:
  - fixtures-replay
  - fixture-mode-spawn-env

steps:
  - kind: invoke_fixture_replay
    params:
      service_id: shopify-api
      method: GET
      url: https://api.shopify.com/admin/api/products.json
      body:
        page: 1
      response:
        status: 200
        body: { products: [] }
    assertions:
      - kind: artifact_written
        path: .jig/dev/fixtures/shopify-api.jsonl
        contains: shopify-api

  # Block 2 — verify the fixture-mode env that ``_run_agent_with_analytics``
  # now stamps onto ctx.extra_env for each spawned agent.
  - kind: invoke_fixture_env
    params:
      ticket_id: tb-feature-fixture
      work_type: feature
    assertions:
      - kind: env_var_set
        name: JIG_FIXTURE_MODE
        value: replay_only
        source: fixture_env

  - kind: invoke_fixture_env
    params:
      ticket_id: tb-spike-fixture
      work_type: spike
    assertions:
      - kind: env_var_set
        name: JIG_FIXTURE_MODE
        value: record_new
        source: fixture_env

final_assertions:
  # Block 4: fixture_cassette proves the cassette landed for the
  # service id (and not just that *some* file with the service-id
  # substring was written, which artifact_written only weakly checks).
  - kind: fixture_cassette
    service_id: shopify-api
  - kind: cost_under_budget
    usd: 1.0
