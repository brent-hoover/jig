spec_version: 1
id: bones-with-hostile
description: |
  Hostile persona walk through the bones spine. Per
  ``docs/synthetic-operator/design.md`` §"Persona library", the
  hostile persona provides ambiguous/contradictory inputs, refuses
  gates initially, and asks tangent questions.

  For Final scope (scripted personas; LLM-driven persona response
  generation is v2.x), the scenario embodies the hostile profile via
  the payloads it sends — short / contradictory L0 prose ("validate
  the spine. or don't. whatever."), terse L3 capability description,
  no extra non-goals (the hostile persona refuses to elaborate). The
  scenario verifies the agent recovers cleanly from the
  hostile-flavored inputs and the spine still resolves.

  The full hostile-as-loop assertion (the agent re-prompts after a
  refusal until the operator accepts a gate) requires LLM-driven
  turns and lands in v2.x.

persona: hostile
estimated_cost_usd_max: 1.0
coverage_tags:
  - po-l0
  - po-l3
  - sa-bones
  - pm-coordinator-bones
  - dev-mock
  - reviewer-contract-compliance
  - persona-hostile

steps:
  - kind: invoke_l0_finalize
    params:
      name: bones-with-hostile
      pitch: validate the spine. or don't. whatever.
      problem: |
        Operator is uncooperative. Validate the agent recovers from
        hostile inputs without crashing.
      audience: |
        Internal jig developers validating the hostile persona path.
      non_goals: []
      author: po-l0
    assertions:
      - kind: artifact_written
        path: .jig/spec/project.md
        contains: bones-with-hostile

  - kind: write_suites_yaml
    params:
      suites_index:
        spec_version: 2
        suites:
          - id: catalog
            title: Catalog
            summary: ingestion of catalog data
            capabilities:
              - shopify-connect
        crosscutting_non_goals: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites.yaml
        contains: shopify-connect

  - kind: invoke_l3_finalize
    params:
      suite_id: catalog
      intro: |
        whatever. catalog from shopify. fine.
      capabilities:
        - id: shopify-connect
          title: Connect Shopify store
          state: planned
          summary: |
            pull the catalog. that's it.
          behaviors:
            - id: pull-catalog
              description: After OAuth completes we pull the catalog
              acceptance_criteria:
                - Catalog rows appear in the products collection
      non_goals: []
      author: po-l3
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites/catalog/brief.md
        contains: shopify-connect

  - kind: write_architecture
    params:
      architecture:
        spec_version: 1
        modules:
          - id: catalog-ingest
            title: Catalog ingest
            summary: |
              Pull catalog data from Shopify.
            implements_capabilities:
              - shopify-connect
            owns:
              - products
            tier_hint: standard
            requires_tracer_bullet: true
            intent:
              problem: |
                Bones spine.
              simplest_solution: |
                One module.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        data_stores: []
        shared_contracts: []
        cross_cutting_policies: []
        risks: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/architecture.yaml
        contains: catalog-ingest

  - kind: write_module_contracts
    params:
      module_id: catalog-ingest
      contracts:
        spec_version: 1
        module: catalog-ingest
        owns:
          - collection: products
            db: catalog
            write_access:
              - self
            read_access: []
        external_dependencies: []
        exposes: []
        emits: []
        integration_ac:
          - capability: shopify-connect
            must:
              - Shopify catalog data flows into the products collection
        behavioral_contracts: []
        data_contracts: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/modules/catalog-ingest/contracts.yaml
        contains: shopify-connect

  - kind: write_build_plan
    params:
      plan:
        spec_version: 1
        project: bones-with-hostile
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: catalog-ingest
            title: Catalog ingest tracer bullet
            suite: catalog
            modules:
              - catalog-ingest
            layers:
              bones:
                status: not_started
                tickets:
                  - tb-catalog-ingest
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: |
                Bones spine.
              simplest_solution: |
                One ticket.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        stalled: []
        open_questions: []
    assertions:
      - kind: artifact_written
        path: .jig/plan/build-plan.yaml
        contains: tb-catalog-ingest

  - kind: materialize_tickets
    assertions:
      - kind: ticket_status
        ticket_id: tb-catalog-ingest
        status: open

  - kind: mock_dev_commit
    params:
      ticket_id: tb-catalog-ingest

  - kind: run_reviewer
    params:
      ticket_id: tb-catalog-ingest
    assertions:
      - kind: reviewer_returned_no_critical
        reviewer_id: contract-compliance

final_assertions:
  # Recovery from hostile input: the spine resolves cleanly despite
  # the persona's contradictory + terse style.
  - kind: ticket_status
    ticket_id: tb-catalog-ingest
    status: resolved
  - kind: analytics_event_emitted
    event_kind: ticket_state_changed
    field_constraints:
      ticket_id: tb-catalog-ingest
      to_state: resolved
  - kind: cost_under_budget
    usd: 1.0
