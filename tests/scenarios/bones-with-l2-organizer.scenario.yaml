spec_version: 1
id: bones-with-l2-organizer
description: |
  The bones-with-l1-discovery scenario, with an additional L2 PO
  ``l2_finalize`` step inserted between L1 and L3 (replaces the
  manual ``write_suites_yaml`` hand-write). Validates that the L2
  Suite Organizer authoring path produces a valid ``suites.yaml`` +
  handoff that downstream phases (L3, SA, Planner, Coordinator,
  Dev, Reviewer) can read past, end-to-end.

  Per ``docs/implementation/v2-plan.md`` Track B MVP scope: L2 suite
  organizer agent. The MVP one-shot ``l2_finalize`` is the smallest
  piece of that scope that swaps cleanly into the bones spine — manual
  L2 hand-write retired in favor of the agent path.

persona: methodical
estimated_cost_usd_max: 1.0

steps:
  # ---- L0 PO --------------------------------------------------------
  - kind: invoke_l0_finalize
    params:
      name: bones-with-l2-organizer
      pitch: a tracer-bullet project that exercises the v2 L2 Suite Organizer path
      problem: |
        We need a single happy-path scenario that proves the L2 PO
        authoring path lands a valid suites.yaml that downstream
        phases can read past.
      audience: |
        Internal jig developers validating that the L2 PO MVP slice
        composes with the rest of the v2 spine.
      non_goals:
        - id: no-edge-cases
          text: This scenario does not cover edge cases or failure modes
          rationale: bones tracer; MVP scenarios cover those
      author: po-l0
    assertions:
      - kind: artifact_written
        path: .jig/spec/project.md
        contains: bones-with-l2-organizer

  # ---- L1 PO (one-shot finalize; collapses the multi-turn walk) ---------
  - kind: invoke_l1_finalize
    params:
      project_name: bones-with-l2-organizer
      intro: |
        Discovery walk for the bones-with-l2-organizer scenario.
      personas:
        - id: merchant
          description: The buyer who integrates jig into their ecommerce site
      journeys:
        - id: j-merchant-onboarding
          persona_id: merchant
          title: Merchant onboarding
          narrative: |
            Merchant signs up, authorizes their Shopify store, and
            confirms the catalog has been pulled into the products
            collection.
          capability_ids:
            - shopify-connect
      capability_roster:
        - id: shopify-connect
          description: Connect Shopify store via OAuth
          journey_ids:
            - j-merchant-onboarding
      author: po-l1
    assertions:
      - kind: artifact_written
        path: .jig/spec/discovery.md
        contains: j-merchant-onboarding
      - kind: artifact_written
        path: .jig/spec/discovery.structured.yaml
        contains: shopify-connect
      - kind: ticket_status
        ticket_id: discovery
        status: resolved

  # ---- L2 PO (one-shot finalize; replaces the manual hand-write) --------
  - kind: invoke_l2_finalize
    params:
      suites:
        - id: catalog
          title: Catalog
          summary: ingestion of catalog data into the local store
          capabilities:
            - shopify-connect
      crosscutting_non_goals: []
      author: po-l2
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites.yaml
        contains: shopify-connect
      - kind: ticket_status
        ticket_id: suites
        status: resolved

  # ---- L3 PO --------------------------------------------------------
  - kind: invoke_l3_finalize
    params:
      suite_id: catalog
      intro: |
        Catalog ingestion suite: pull catalog data from Shopify and
        normalize into our products collection.
      capabilities:
        - id: shopify-connect
          title: Connect Shopify store via OAuth
          state: planned
          summary: |
            Operator authorizes their Shopify store; we pull the catalog
            and normalize into the products collection.
          behaviors:
            - id: begin-oauth
              description: Operator initiates OAuth handshake from settings
              acceptance_criteria:
                - Operator clicks Connect Shopify and is redirected
            - id: pull-catalog
              description: After OAuth completes we pull the catalog
              acceptance_criteria:
                - Catalog rows appear in the products collection
      non_goals: []
      author: po-l3
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites/catalog/brief.md
        contains: shopify-connect

  # ---- SA (operator hand-writes architecture + module contract) ---------
  - kind: write_architecture
    params:
      architecture:
        spec_version: 1
        modules:
          - id: catalog-ingest
            title: Catalog ingest
            summary: |
              Pulls catalog data from Shopify and normalizes into the
              products collection.
            implements_capabilities:
              - shopify-connect
            owns:
              - products
            tier_hint: standard
            requires_tracer_bullet: true
            intent:
              problem: |
                Bones needs a module that owns the products collection
                so the contract-compliance reviewer has something to
                check the dev's diff against.
              simplest_solution: |
                One module that handles Shopify ingest and writes to
                a single owned collection.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        data_stores: []
        shared_contracts: []
        cross_cutting_policies: []
        risks: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/architecture.yaml
        contains: catalog-ingest

  - kind: write_module_contracts
    params:
      module_id: catalog-ingest
      contracts:
        spec_version: 1
        module: catalog-ingest
        owns:
          - collection: products
            db: catalog
            write_access:
              - self
            read_access: []
        external_dependencies: []
        exposes: []
        emits: []
        integration_ac:
          - capability: shopify-connect
            must:
              - Shopify catalog data flows into the products collection
              - catalog-ingested event published with normalized payload
        behavioral_contracts: []
        data_contracts: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/modules/catalog-ingest/contracts.yaml
        contains: shopify-connect

  # ---- Planner PM (v2 agent path) ---------------------------------------
  - kind: invoke_plan_finalize
    params:
      plan:
        spec_version: 1
        project: bones-with-l2-organizer
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: catalog-ingest
            title: Catalog ingest tracer bullet
            suite: catalog
            modules:
              - catalog-ingest
            layers:
              bones:
                status: not_started
                tickets:
                  - tb-catalog-ingest
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: |
                Validate the bones spine end-to-end with the L2 PO
                authoring path: suites.yaml is committed by the agent
                before the L3 brief dispatches.
              simplest_solution: |
                One epic, one bones ticket, one capability, one
                integration AC.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        stalled: []
        open_questions: []
      author: planner-pm
    assertions:
      - kind: artifact_written
        path: .jig/plan/build-plan.yaml
        contains: tb-catalog-ingest
      - kind: ticket_status
        ticket_id: plan
        status: resolved

  - kind: materialize_tickets
    assertions:
      - kind: ticket_status
        ticket_id: tb-catalog-ingest
        status: open

  # ---- Dev (mock in CI; real-mode CLI replaces with a Claude agent) -----
  - kind: mock_dev_commit
    params:
      ticket_id: tb-catalog-ingest

  # ---- Reviewer ----------------------------------------------------
  - kind: run_reviewer
    params:
      ticket_id: tb-catalog-ingest
    assertions:
      - kind: reviewer_returned_no_critical
        reviewer_id: contract-compliance

# ---- final assertions: spine cohesion + analytics + cost ---------------
final_assertions:
  - kind: ticket_status
    ticket_id: tb-catalog-ingest
    status: resolved
  - kind: analytics_event_emitted
    event_kind: ticket_state_changed
    field_constraints:
      ticket_id: tb-catalog-ingest
      to_state: resolved
  - kind: cost_under_budget
    usd: 1.0
