spec_version: 1
id: bones-with-responsive
description: |
  Track D Final — exercises the ResponsiveDesignReviewer (mechanical)
  against an authored wireframe. The ``invoke_responsive_review``
  step swaps in a wireframe HTML missing the viewport meta tag, with
  a fixed-width attribute, and with empty breakpoints in the meta —
  three independent rules trip simultaneously so the scenario verifies
  the reviewer's per-rule emission.

  Mock-mode safe — no LLM, fully deterministic.

persona: methodical
estimated_cost_usd_max: 1.0
coverage_tags:
  - vd-finalize
  - wireframe-lint
  - reviewer-responsive

steps:
  - kind: invoke_l0_finalize
    params:
      name: bones-with-responsive
      pitch: responsive-review scenario
      problem: |
        Need a scenario that drives the responsive-design reviewer
        end-to-end so coverage tagging gates on real invocation
        (not just unit tests).
      audience: jig developers verifying Track D Final wiring.
      non_goals:
        - id: no-px-fonts
          text: skipped here
          rationale: covered in unit tests
      author: po-l0

  - kind: write_suites_yaml
    params:
      suites_index:
        spec_version: 1
        suites:
          - id: jobs
            title: Jobs
            summary: posting jobs
            capabilities:
              - post-a-job
        crosscutting_non_goals: []

  - kind: invoke_l3_finalize
    params:
      suite_id: jobs
      intro: Jobs suite
      capabilities:
        - id: post-a-job
          title: Post
          state: planned
          summary: Submit
          behaviors:
            - id: submit
              description: Submit
              acceptance_criteria:
                - validate
      non_goals: []
      author: po-l3

  - kind: write_architecture
    params:
      architecture:
        spec_version: 1
        data_stores:
          - id: main-db
            kind: sqlite
            rationale: bones
            accessed_by: [jobs-api]
        modules:
          - id: jobs-api
            title: Jobs API
            summary: Backend.
            implements_capabilities: [post-a-job]
            owns: [jobs]
            tier_hint: standard
            requires_tracer_bullet: true
            n_a_categories:
              - behavioral_contracts
              - external_dependencies
            intent:
              problem: bones
              simplest_solution: one
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        shared_contracts: []
        cross_cutting_policies: []
        risks: []
        open_questions: []
        change_log: []

  - kind: write_module_contracts
    params:
      module_id: jobs-api
      contracts:
        spec_version: 1
        module: jobs-api
        owns:
          - collection: jobs
            db: main-db
            write_access: [self]
            read_access: []
        external_dependencies: []
        exposes: []
        emits: []
        integration_ac:
          - capability: post-a-job
            must:
              - jobs accepts a row
        behavioral_contracts: []
        data_contracts: []
        open_questions: []
        change_log: []

  - kind: invoke_vd_finalize
    params:
      frontend:
        spec_version: 1
        stack:
          framework: htmx_alpine
          language: python_jinja
          bundler: none
          css: custom_utility
          notes: stack
        allowed_dependencies:
          - alpinejs
        intent:
          problem: needs frontend
          simplest_solution: minimal
          complications_considered:
            scale: null
            concurrency: null
            failure_modes: null
            cross_cutting: null
      wireframes:
        - screen_id: post-a-job
          html: |
            <!-- wireframe-meta: {"screen_id": "post-a-job", "title": "Post a job", "persona_targets": ["merchant"], "journey_refs": ["j-merchant-onboarding"], "breakpoints": ["mobile", "tablet", "desktop"]} -->
            <!doctype html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
            </head>
            <body><main><h1>Post a job</h1></main></body></html>
      summary: clean wireframe
      author: vd

  - kind: invoke_plan_finalize
    params:
      plan:
        spec_version: 1
        project: bones-with-responsive
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: jobs-tracer
            title: Jobs tracer
            suite: jobs
            modules: [jobs-api]
            layers:
              bones:
                status: not_started
                tickets: [tb-post-a-job]
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: bones
              simplest_solution: one
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
            acceptance_criteria:
              - "Scenario placeholder; refine per test intent."
        stalled: []
        open_questions: []
      author: planner-pm

  - kind: materialize_tickets
    params:
      visual_references_by_ticket:
        tb-post-a-job:
          - post-a-job

  # ---- Responsive review with a broken wireframe -------------------
  - kind: invoke_responsive_review
    params:
      ticket_id: tb-post-a-job
      screen_id: post-a-job
      html: |
        <!-- wireframe-meta: {"screen_id": "post-a-job", "title": "Post", "persona_targets": [], "journey_refs": [], "breakpoints": []} -->
        <!doctype html>
        <html lang="en">
        <head><title>T</title></head>
        <body><main><div width="600"><h1>Post</h1></div></main></body>
        </html>

final_assertions:
  - kind: cost_under_budget
    usd: 1.0
