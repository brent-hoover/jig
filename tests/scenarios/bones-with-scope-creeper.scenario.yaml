spec_version: 1
id: bones-with-scope-creeper
description: |
  Scope-creeper persona walk through the bones spine. Per
  ``docs/v2.0/synthetic-operator/design.md`` §"Persona library", the
  scope-creeper persona pushes for additional features mid-stream
  and tries to expand non-goals into scope.

  For Final scope, the scenario embodies that profile via the
  payloads it sends — extra non-goals at L0 (the "additions" the
  scope-creeper would push), but the L2 suite allowlist is the
  source of truth for capability scope. The scenario verifies the
  spine resolves end-to-end with the L2-allowed capability set
  intact (the L3 PO's allowlist validator would reject any extra
  capability beyond what L2 sanctioned — that branch is exercised
  in test_sim_bones_with_scope_creeper_scenario.py's allowlist
  test).

persona: scope-creeper
estimated_cost_usd_max: 1.0
coverage_tags:
  - po-l0
  - po-l3
  - sa-bones
  - pm-coordinator-bones
  - dev-mock
  - reviewer-contract-compliance
  - persona-scope-creeper

steps:
  # ---- L0 PO: scope-creeper introduces extra non-goals (which is in-scope
  # behavior — the persona "negotiates" non-goals). The non-goals do not
  # affect the build plan because they're declared as non-goals.
  - kind: invoke_l0_finalize
    params:
      name: bones-with-scope-creeper
      pitch: tracer bullet that exercises the scope-creeper persona
      problem: |
        Validate the spine while the scope-creeper persona attempts
        to expand scope. The L2 suite allowlist holds the line.
      audience: |
        Internal jig developers validating the scope-creeper persona path.
      non_goals:
        - id: no-email-notifications
          text: This scenario does not include email notifications
          rationale: scope-creeper proposed; deferred per L0 alignment
        - id: no-sms
          text: This scenario does not include SMS
          rationale: scope-creeper proposed; deferred per L0 alignment
        - id: no-csv-export
          text: This scenario does not include CSV export
          rationale: scope-creeper proposed; deferred per L0 alignment
      author: po-l0
    assertions:
      - kind: artifact_written
        path: docs/brief.md
        contains: bones-with-scope-creeper

  - kind: write_suites_yaml
    params:
      suites_index:
        spec_version: 2
        suites:
          - id: catalog
            title: Catalog
            summary: ingestion of catalog data into the local store
            capabilities:
              - shopify-connect
        crosscutting_non_goals: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites.yaml
        contains: shopify-connect

  # ---- L3 PO: the scope-creeper's "extras" stay in non_goals (the L3
  # validator would reject them as capabilities). The actual capability
  # list matches the L2 allowlist exactly.
  - kind: invoke_l3_finalize
    params:
      suite_id: catalog
      intro: |
        Catalog ingestion suite. The scope-creeper persona's extras
        (email, SMS, CSV export) stay in non_goals — the L2 allowlist
        is the source of truth.
      capabilities:
        - id: shopify-connect
          title: Connect Shopify store via OAuth
          state: planned
          summary: |
            Operator authorizes their Shopify store; we pull the catalog.
          behaviors:
            - id: pull-catalog
              description: After OAuth completes we pull the catalog
              acceptance_criteria:
                - Catalog rows appear in the products collection
      non_goals:
        - id: no-email-notifications
          text: This scenario does not include email notifications
          rationale: scope-creeper proposed; deferred
      author: po-l3
    assertions:
      - kind: artifact_written
        path: .jig/spec/suites/catalog/brief.md
        contains: shopify-connect

  - kind: write_architecture
    params:
      architecture:
        spec_version: 1
        modules:
          - id: catalog-ingest
            title: Catalog ingest
            summary: |
              Pull catalog data from Shopify.
            implements_capabilities:
              - shopify-connect
            owns:
              - products
            tier_hint: standard
            requires_tracer_bullet: true
            intent:
              problem: |
                Need a module that owns the products collection.
              simplest_solution: |
                One module that handles Shopify ingest.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        data_stores: []
        shared_contracts: []
        cross_cutting_policies: []
        risks: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/architecture.yaml
        contains: catalog-ingest

  - kind: write_module_contracts
    params:
      module_id: catalog-ingest
      contracts:
        spec_version: 1
        module: catalog-ingest
        owns:
          - collection: products
            db: catalog
            write_access:
              - self
            read_access: []
        external_dependencies: []
        exposes: []
        emits: []
        integration_ac:
          - capability: shopify-connect
            must:
              - Shopify catalog data flows into the products collection
        behavioral_contracts: []
        data_contracts: []
        open_questions: []
        change_log: []
    assertions:
      - kind: artifact_written
        path: .jig/spec/modules/catalog-ingest/contracts.yaml
        contains: shopify-connect

  - kind: write_build_plan
    params:
      plan:
        spec_version: 1
        project: bones-with-scope-creeper
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: catalog-ingest
            title: Catalog ingest tracer bullet
            suite: catalog
            modules:
              - catalog-ingest
            layers:
              bones:
                status: not_started
                tickets:
                  - tb-catalog-ingest
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: |
                Bones spine for the scope-creeper scenario.
              simplest_solution: |
                One ticket — extras stay deferred.
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        stalled: []
        open_questions: []
    assertions:
      - kind: artifact_written
        path: .jig/plan/build-plan.yaml
        contains: tb-catalog-ingest

  - kind: materialize_tickets
    assertions:
      - kind: ticket_status
        ticket_id: tb-catalog-ingest
        status: open

  - kind: mock_dev_commit
    params:
      ticket_id: tb-catalog-ingest

  - kind: run_reviewer
    params:
      ticket_id: tb-catalog-ingest
    assertions:
      - kind: reviewer_returned_no_critical
        reviewer_id: contract-compliance

final_assertions:
  - kind: ticket_status
    ticket_id: tb-catalog-ingest
    status: resolved
  - kind: analytics_event_emitted
    event_kind: ticket_state_changed
    field_constraints:
      ticket_id: tb-catalog-ingest
      to_state: resolved
  - kind: cost_under_budget
    usd: 1.0
  # Scope held: brief.md must record the deferred extras as non-goals.
  - kind: artifact_written
    path: docs/brief.md
    contains: no-email-notifications
