spec_version: 1
id: bones-with-spike
description: |
  Extends ``bones-with-mvp-sa`` with a risk + spike workflow that
  resolves to ``mitigated`` (the happy path). The risk is authored,
  a spike ticket is created, the spike completes with a positive
  finding, and the risk transitions to ``mitigated``. The cascade
  branch is exercised by ``bones-with-cascade.scenario.yaml`` so this
  scenario stays focused on the spike-without-cascade path.

  Per ``docs/sa-architecture/design.md`` §"Risk identification and
  spikes": this is the common case — most spikes confirm the
  assumption holds; only a minority surface as confirmed_impossible.

persona: methodical
estimated_cost_usd_max: 1.0
coverage_tags:
  - po-l0
  - po-l1
  - po-l2
  - po-l3
  - sa-incremental
  - sa-risks
  - sa-spike-mitigated
  - pm-planner
  - pm-coordinator-bones
  - dev-mock
  - reviewer-contract-compliance

steps:
  # ---- L0 PO --------------------------------------------------------
  - kind: invoke_l0_finalize
    params:
      name: bones-with-spike
      pitch: a tracer-bullet project that exercises the SA risk + spike workflow
      problem: |
        We need a happy-path scenario that proves the risk + spike
        workflow lands an open risk, transitions it to spike_proposed,
        and resolves it to mitigated when the spike confirms the
        assumption holds.
      audience: |
        Internal jig developers validating the Track C MVP follow-on.
      non_goals:
        - id: no-cascade
          text: This scenario does not exercise the cascade-after-impossible branch
          rationale: bones-with-cascade owns that path
      author: po-l0
    assertions:
      - kind: artifact_written
        path: .jig/spec/project.md
        contains: bones-with-spike

  # ---- L1 PO --------------------------------------------------------
  - kind: invoke_l1_finalize
    params:
      project_name: bones-with-spike
      intro: |
        Discovery walk for the bones-with-spike scenario.
      personas:
        - id: merchant
          description: The buyer who integrates jig into their ecommerce site
      journeys:
        - id: j-merchant-onboarding
          persona_id: merchant
          title: Merchant onboarding
          narrative: |
            Merchant signs up, authorizes their Shopify store, and
            confirms the catalog has been pulled into the products
            collection.
          capability_ids:
            - shopify-connect
      capability_roster:
        - id: shopify-connect
          description: Connect Shopify store via OAuth
          journey_ids:
            - j-merchant-onboarding
      author: po-l1

  # ---- L2 PO --------------------------------------------------------
  - kind: invoke_l2_finalize
    params:
      suites:
        - id: catalog
          title: Catalog
          summary: ingestion of catalog data into the local store
          capabilities:
            - shopify-connect
      crosscutting_non_goals: []
      author: po-l2

  # ---- L3 PO --------------------------------------------------------
  - kind: invoke_l3_finalize
    params:
      suite_id: catalog
      intro: |
        Catalog ingestion suite: pull catalog data from Shopify.
      capabilities:
        - id: shopify-connect
          title: Connect Shopify store via OAuth
          state: planned
          summary: |
            Operator authorizes their Shopify store; we pull the catalog.
          behaviors:
            - id: begin-oauth
              description: Operator initiates OAuth handshake from settings
              acceptance_criteria:
                - Operator clicks Connect Shopify and is redirected
      non_goals: []
      author: po-l3

  # ---- SA MVP ------------------------------------------------------
  - kind: invoke_sa_incremental
    params:
      calls:
        - tool: arch_set_data_store
          params:
            data_store:
              id: main-db
              kind: sqlite
              rationale: bones — single-process file-backed
              accessed_by: [catalog-ingest]

        - tool: arch_set_module
          params:
            module:
              id: catalog-ingest
              title: Catalog Ingest
              summary: |
                Pulls catalog data from Shopify and normalizes into the
                products collection.
              implements_capabilities:
                - shopify-connect
              owns:
                - products
              tier_hint: standard
              requires_tracer_bullet: true
              n_a_categories:
                - behavioral_contracts
              intent:
                problem: bones MVP catalog ingest
                simplest_solution: one module, one collection
                complications_considered:
                  scale: null
                  concurrency: null
                  failure_modes: null
                  cross_cutting: null

        - tool: module_set_owned_collection
          params:
            module_id: catalog-ingest
            owned_collection:
              collection: products
              db: main-db
              write_access: [self]

        - tool: module_set_external_dependency
          params:
            module_id: catalog-ingest
            external_dependency:
              id: shopify-api
              kind: external_http
              rate_limit: 2 req/sec per shop
              auth: oauth2 token per shop

        - tool: module_set_integration_ac
          params:
            module_id: catalog-ingest
            integration_ac:
              capability: shopify-connect
              must:
                - Shopify catalog data flows into the products collection

      finalize:
        summary: SA-MVP bones for spike scenario
        author: sa-mvp
    assertions:
      - kind: ticket_status
        ticket_id: architecture
        status: resolved

  # ---- Risk register + spike (mitigated outcome) -------------------
  - kind: invoke_risk_and_spike
    params:
      risk:
        id: r-shopify-rate-limit
        text: Shopify rate limits may force batched fetches.
        impact: low
        likelihood: medium
        status: open
      propose:
        summary: |
          Probe Shopify's rate limiter with a tracer-bullet fetch and
          measure observed throttling.
        dependent_contracts:
          - project://arch/modules/catalog-ingest/contracts#external_dependencies/shopify-api
      complete:
        finding: |
          Observed throttling at advertised rate; staying under 2 req/sec
          per shop is sufficient for our SLA.
        status: mitigated
      author: sa-mvp
    assertions:
      - kind: ticket_status
        ticket_id: spike-r-shopify-rate-limit
        status: resolved

  # ---- Planner PM --------------------------------------------------
  - kind: invoke_plan_finalize
    params:
      plan:
        spec_version: 1
        project: bones-with-spike
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: catalog-ingest
            title: Catalog ingest tracer bullet
            suite: catalog
            modules:
              - catalog-ingest
            layers:
              bones:
                status: not_started
                tickets:
                  - tb-catalog-ingest
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: validate spine end-to-end with mitigated risk
              simplest_solution: one bones ticket
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        stalled: []
        open_questions: []
      author: planner-pm

  - kind: materialize_tickets
    assertions:
      - kind: ticket_status
        ticket_id: tb-catalog-ingest
        status: open

  # ---- Dev (mock) --------------------------------------------------
  - kind: mock_dev_commit
    params:
      ticket_id: tb-catalog-ingest

  # ---- Reviewer ----------------------------------------------------
  - kind: run_reviewer
    params:
      ticket_id: tb-catalog-ingest
    assertions:
      - kind: reviewer_returned_no_critical
        reviewer_id: contract-compliance

# ---- final assertions: spike resolved to mitigated; cascade did NOT fire
# Block 4: the previous bones-only assertions only checked the ticket
# transitioned to RESOLVED — they didn't pin the actual risk-state
# transition the SA design promises. The risk_status assertion proves
# the spike-completion handler advanced the risk to ``mitigated``
# (and not, say, ``confirmed_impossible``, which would have triggered
# the cascade workflow).
final_assertions:
  - kind: ticket_status
    ticket_id: tb-catalog-ingest
    status: resolved
  # Spike ticket landed and resolved.
  - kind: ticket_status
    ticket_id: spike-r-shopify-rate-limit
    status: resolved
  - kind: risk_status
    risk_id: r-shopify-rate-limit
    status: mitigated
  - kind: cost_under_budget
    usd: 1.0
