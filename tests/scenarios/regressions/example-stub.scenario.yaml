# Regression scenario for bug: example-stub
# Description: example regression scenario seeded by Track H Final to claim the
#   regression-scenarios coverage tag and demonstrate the convention. Real
#   regression scenarios scaffolded via ``jig sim regression new`` go alongside.
# Per docs/synthetic-operator/design.md §"Failure-mode regression scenarios":
#   every bug lands with one regression scenario that would have caught it.
# This particular file is intentionally a near-trivial scenario — the
# walking-skeleton spine — so the regression-scenarios coverage tag has at
# least one claimant in the in-tree library.

spec_version: 1
id: regression-example-stub
description: |
  Stub regression scenario that exercises the walking-skeleton spine. Seeds
  the regression-scenarios coverage tag so the discipline is wired from
  Track H Final forward; real bug-driven regressions scaffold via
  ``jig sim regression new --bug-id <id>``.
persona: methodical
estimated_cost_usd_max: 1.0
tier: smoke
coverage_tags:
  - regression-scenarios
  - po-l0
  - po-l3
  - sa-bones
  - pm-coordinator-bones
  - dev-mock
  - reviewer-contract-compliance

steps:
  - kind: invoke_l0_finalize
    params:
      name: regression-example-stub
      pitch: stub regression scenario for the regression-scenarios coverage tag
      problem: |
        Demonstrate the regression-scenarios discipline.
      audience: |
        Internal jig developers.
      non_goals: []
      author: po-l0
    assertions:
      - kind: artifact_written
        path: .jig/spec/project.md
        contains: regression-example-stub

  - kind: write_suites_yaml
    params:
      suites_index:
        spec_version: 2
        suites:
          - id: catalog
            title: Catalog
            summary: ingest
            capabilities:
              - shopify-connect
        crosscutting_non_goals: []

  - kind: invoke_l3_finalize
    params:
      suite_id: catalog
      intro: stub regression L3
      capabilities:
        - id: shopify-connect
          title: Connect Shopify
          state: planned
          summary: pull catalog
          behaviors:
            - id: pull-catalog
              description: After OAuth completes we pull the catalog
              acceptance_criteria:
                - Catalog rows appear in the products collection
      non_goals: []
      author: po-l3

  - kind: write_architecture
    params:
      architecture:
        spec_version: 1
        modules:
          - id: catalog-ingest
            title: Catalog ingest
            summary: pull catalog
            implements_capabilities:
              - shopify-connect
            owns:
              - products
            tier_hint: standard
            requires_tracer_bullet: true
            intent:
              problem: stub
              simplest_solution: stub
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        data_stores: []
        shared_contracts: []
        cross_cutting_policies: []
        risks: []
        open_questions: []
        change_log: []

  - kind: write_module_contracts
    params:
      module_id: catalog-ingest
      contracts:
        spec_version: 1
        module: catalog-ingest
        owns:
          - collection: products
            db: catalog
            write_access:
              - self
            read_access: []
        external_dependencies: []
        exposes: []
        emits: []
        integration_ac:
          - capability: shopify-connect
            must:
              - Shopify catalog data flows into the products collection
        behavioral_contracts: []
        data_contracts: []
        open_questions: []
        change_log: []

  - kind: write_build_plan
    params:
      plan:
        spec_version: 1
        project: regression-example-stub
        revision: 1
        ordering_rule: bones_first
        epics:
          - id: catalog-ingest
            title: Catalog ingest tracer bullet
            suite: catalog
            modules:
              - catalog-ingest
            layers:
              bones:
                status: not_started
                tickets:
                  - tb-catalog-ingest
              mvp:
                status: not_started
                tickets: []
              final:
                status: not_started
                tickets: []
            risks_addressed: []
            intent:
              problem: stub
              simplest_solution: stub
              complications_considered:
                scale: null
                concurrency: null
                failure_modes: null
                cross_cutting: null
        stalled: []
        open_questions: []

  - kind: materialize_tickets

  - kind: mock_dev_commit
    params:
      ticket_id: tb-catalog-ingest

  - kind: run_reviewer
    params:
      ticket_id: tb-catalog-ingest

final_assertions:
  - kind: ticket_status
    ticket_id: tb-catalog-ingest
    status: resolved
